name: Avisador de grupos Kodland

# El cron de GitHub no es confiable para intervalos cortos: con "*/5" solo
# corría cada 3-6 horas. Por eso cada ejecución se queda vigilando ~5,5 horas
# (revisa cada ~5 min) y al terminar lanza la siguiente. El cron por hora queda
# solo como respaldo por si esa cadena se corta.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write            # guardar estado.json
  actions: write             # lanzar la siguiente ejecución

concurrency:
  group: avisador-kodland
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cachear navegador de Playwright
        uses: actions/cache@v4
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar Chromium (Playwright)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Instalar solo dependencias del sistema (si el navegador ya está en caché)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      # Solo cuando lo lanzas tú a mano (no en la cadena automática): confirma
      # que ntfy recibe mensajes desde GitHub. Si falla, la ejecución queda en rojo.
      - name: Notificación de prueba
        if: github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]'
        env:
          URL_APP: ${{ secrets.URL_APP }}
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
        run: python avisador.py --probar

      - name: Vigilar cursos (~5,5 horas, revisando cada ~5 min)
        env:
          URL_APP: ${{ secrets.URL_APP }}
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
          SESION_JSON: ${{ secrets.SESION_JSON }}
        run: |
          git config user.name "avisador-bot"
          git config user.email "avisador-bot@users.noreply.github.com"
          FIN=$((SECONDS + 330 * 60))
          FALLO=0
          while [ $SECONDS -lt $FIN ]; do
            python avisador.py --una-vez || FALLO=1
            git add estado.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Actualiza estado [skip ci]"
              git pull -q --rebase && git push -q || echo "No se pudo guardar estado.json"
            fi
            # Si ntfy falla, cortamos para que la ejecución quede en rojo y se note
            if [ $FALLO = 1 ]; then exit 1; fi
            sleep 180
          done

      - name: Lanzar la siguiente ejecución
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run avisador.yml --ref main
